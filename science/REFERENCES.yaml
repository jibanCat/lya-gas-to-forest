    identifiers:
      url: "https://physics.nist.gov/asd"
      query_used: "https://physics.nist.gov/cgi-bin/ASD/lines1.pl?spectra=H+I&limits_type=0&low_w=1215&upp_w=1216&unit=0&format=3&show_obs_wl=1&show_calc_wl=1&unc_out=1&A_out=0&f_out=on&S_out=on&loggf_out=on&intens_out=on&allowed_out=1&forbid_out=1&conf_out=on&term_out=on&enrg_out=on&J_out=on&g_out=on&bibrefs=1"
    supports:
      - claim: "Lyα 1s 2S1/2 – 2p 2P°3/2 and – 2p 2P°1/2 vacuum (Ritz) wavelengths, Aki, fik, gi, gk; unresolved 1s–2 multiplet λ = 1215.6701 Å, f = 0.41641"
        location: "H I lines output, 1215–1216 Å (4 lines: 2p3/2, 2p1/2, unresolved '1s–2', 2s M1)"
        location_verified: true
        how_verified: "Downloaded the tab-separated ASD output (format=3) and the HTML output with bibliographic references on 2026-10-02; values transcribed in constants: CONST-LYA-*."
      - claim: "Source attribution of the ASD values"
        location: "ASD header: energy levels & lines = Kramida 2010; transition probabilities = Wiese & Fuhr 2009, Jitrik & Bunge 2004 (the latter rescaled to CODATA-2018 constants by A. Kramida for ASD v5.10, Oct 2022). Per-line refs: TP T7771 = Jitrik & Bunge 2004 (2p3/2, 2p1/2); TP T8637 = Baker 2008 NIST TN 1612 (unresolved 1s–2); line ref L12020 = Sansonetti et al. 2004 ApJS 153, 555 (observed λ)."
        location_verified: true
        how_verified: "Read the ASD bibliography pop-ups (get_ASBib_ref.cgi) for refs 7771, 8637, 8610, 12020, 15291."
      - claim: "Lyβ (H I 1s–3p): 3p 2P°3/2 Ritz λvac 1025.72182505 ± 0.00000007 Å, A 1.6725e8 s^-1, f 5.2761e-2; 3p 2P°1/2 Ritz 1025.72296565 ± 0.00000007 Å, A 1.6725e8, f 2.6380e-2; unresolved '1s–3' line (upper level '3' = centroid of all n = 3 levels 3s, 3p, 3d; gk = 18): observed 1025.728 ± 0.003 Å, Ritz 1025.7220 ± 0.0003 Å, f 7.9142e-2, S 0.53450, log gf −0.80056, A 5.5751e7 (g-averaged over 18 substates; NOT a 3p decay rate)"
        location: "H I lines output, 1025–1026 Å (6 lines: 1s–3d5/2 E2, 1s–3d3/2 E2, 1s–3s M1, 1s–3p3/2, unresolved 1s–3, 1s–3p1/2); TP refs T7771 (3p components), T8637 (unresolved line); line ref L3545 (observed λ)"
        location_verified: true
        how_verified: "2026-10-03: read the ASD v5.12 HTML lines output (format=0, bibrefs=1) for 1025–1026 Å via WebFetch. Transcription cross-checked: every Ritz λ equals 1e8/Ek[cm^-1] to the printed digits and every log gf = log10(2f). The tab-separated (format=3) query returned HTTP 500 this time. The ASBib entry for L3545 could not be retrieved (bibliographic identity of the observed-λ source not checked)."
      - claim: "Si IV 3s ²S1/2 – 3p ²P°3/2 (the stronger resonance line): vacuum λ 1393.76 Å observed (Ritz 1393.7546 Å), f = 0.513, accuracy A+ (≤ 2 %); partner 3s ²S1/2 – 3p ²P°1/2 at 1402.77 Å, f = 0.255"
        location: "Si IV lines output, 1390–1405 Å (ASD v5.12, accessed 2026-10-04); query https://physics.nist.gov/cgi-bin/ASD/lines1.pl?spectra=Si+IV&limits_type=0&low_w=1390&upp_w=1405&unit=0&format=3&show_obs_wl=1&show_calc_wl=1&f_out=on"
        location_verified: true
        how_verified: "2026-10-04 (literature check): read in the text at this location; quote re-checked against the saved extract."
    status: verified
    notes: >-
      The unresolved '1s–2' line has upper level '2' = centroid of ALL n=2 levels incl. 2s (gk = 8); ASD notes these
      combined lines are 'pertinent to observations of the solar corona'. Its Aki = 4.6986e8 s^-1 is averaged over
      8 substates (6/8 × A_2p) and must NOT be used as the 2p decay rate / damping constant. Its f = 0.41641 is
      fine to use (2s contributes no E1 absorption).

