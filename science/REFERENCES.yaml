# REFERENCE_AUDIT.yaml — claim-level citation and constants audit for the Lyα teaching resource
# Audited: 2026-10-02 (web access). Companion narrative: REFERENCE_AUDIT_NOTES.md
#
# Conventions
#   location_verified: true  -> I saw the stated section/equation/table/page in the source itself
#                               (arXiv full text, publisher/NIST PDF, scanned ADS page, or official ToC/errata).
#   location_verified: false -> NOT seen in the source; whatever is written is a pointer, not a citation.
#   "arXiv vN" in how_verified: equation numbers were read in that arXiv version; journal pagination not
#                               checked (publisher PDFs were paywalled). Equation numbering normally matches.
#   Bibliographic data (journal/vol/page/DOI) were checked against Crossref (api.crossref.org) unless noted.
#   ADS bibcodes are given ONLY where an ADS record with that bibcode was returned by a search restricted to
#   ui.adsabs.harvard.edu (the ADS UI itself blocks automated access). Otherwise `ads: unverified`.
#   Book equation numbers are unverified unless explicitly stated (only R&L ch.1 could be read).

references:

