    notes: >-
      Crossref gives pages 565–720; NIST's bibliography lists 565–726 (difference is the end page only).
      NIST ASD v5.12 now shows A = 6.2648e8 (2p1/2) and 6.2647e8 (2p3/2) after CODATA-2018 rescaling (Oct 2022);
      W&F 2009 is the source of the commonly quoted 6.2649e8.

