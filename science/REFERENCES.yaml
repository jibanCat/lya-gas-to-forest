      - claim: "Lyβ 1s–3p multiplet: λvac 1025.72 Å, Ei–Ek 0.000–97 492.28 cm^-1, gi–gk 2–6, A = 1.6725e8 s^-1, f = 7.9142e-2, S = 5.3450e-1 a.u., log gf = −0.80056, Acc. AAA, source 4 (Baker 2008); components 2–4: 1025.722 Å (Ek 97 492.320), f 5.2761e-2, S 3.5633e-1; 2–2: 1025.723 Å (Ek 97 492.211), f 2.6381e-2, S 1.7817e-1"
        location: "Table 6 ('H I: Allowed transitions, fine structure lines'), entry No. 2, p. 578"
