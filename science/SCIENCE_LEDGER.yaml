- id: SCI-SAT-002
  anchor: damping-wings
  title: Where damping wings become visible
  domain: line formation
  claim: >
    From the Lorentzian asymptote, τ(Δv) ≈ Nσ_vγ/(πΔv²), so the wing reaches τ = 1 at Δv ≈ √(Nσ_vγ/π) ≈ 160 km/s
    (N/10¹⁹ cm⁻²)^½, independent of b (this algebra is ours, from the far-wing profile in Meiksin 2009). For forest lines (N ≲ 10¹⁵) this
