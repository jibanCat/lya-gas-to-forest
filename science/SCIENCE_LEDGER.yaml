      - {ref: REF-HGZ97, location: "§2, Eqs. (1) and (5): τ along the sightline; sum over streams with |du/dx|⁻¹", verified: true}
      - {ref: REF-BIRD15, location: "§2.6 Artificial Spectra, Eqs. (6)–(7)", verified: true}
  oracle: {kind: numerical, ref: ORC-FAKE-SPECTRA, detail: "fake_spectra 2.2.4 _Particle_Interpolate on controlled skewers"}
