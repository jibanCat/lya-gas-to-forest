# ------------------------------------------------------------------------------------------------ ionisation
- id: SCI-ION-001
  anchor: photoionisation-equilibrium
  title: Photoionisation equilibrium and the neutral-amount control
  domain: atomic / IGM
  claim: >
    In the highly ionised IGM, photoionisation balances recombination: n_HI Γ_HI = α(T) n_e n_p, so
    n_HI ≈ α(T) n_e n_H / Γ_HI ∝ Δ² T^(−0.7) / Γ_HI. Changing the UV background rescales n_HI (and τ) by 1/Γ_HI;
    it does not move lines or change their τ-shape.
  equations:
    - tex: 'n_{\rm HI} \simeq \frac{\alpha_A(T)\,n_e\,n_{\rm H}}{\Gamma_{\rm HI}},\qquad \alpha_A \simeq 4.2\times10^{-13}\,(T/10^4\,{\rm K})^{-0.7}\ {\rm cm^3\,s^{-1}}'
  convention: case-A recombination (optically thin IGM); n_e = 1.163 n_H (H and He fully ionised, Y_P = 0.2454, Planck 2018)
  teaching_representation: '"neutral amount" control in the core path (Beat 6); the UV background and "bleaching" (gas outline stays, ink fades as Γ rises) only in the Beat 6 microscope'
  assumptions:
    - ionisation equilibrium (recombination time ≪ Hubble time is NOT true at mean density; equilibrium is still set by photoionisation, which is fast)
    - He fully ionised (n_e/n_H = 1.081 with helium singly ionised to 1.163 fully ionised, for Y_P = 0.2454; a 7 % systematic)
  validity: n_HI ≪ n_H (forest; not self-shielded LLS/DLAs)
  simplifications:
    - The teaching control changes N_HI directly, holding density, temperature and position fixed; real UV changes also heat the gas.
  sources:
    primary: [{ref: REF-HG97, location: "Eq. (12): α ≈ 4×10⁻¹³ (T/10⁴ K)^−0.7 cm³ s⁻¹; Appendix A fit", verified: true}, {ref: REF-MCQUINN16, location: "§2.1, Eq. (2): x_HI = α_A n_e/Γ", verified: true}]
    secondary: [{ref: REF-MEIKSIN09, location: "§III.A.1, Eqs. (40)–(42)", verified: true}, {ref: REF-DRAINE11, location: "§14.2, Eq. (14.3): α_A ≈ 4.13e-13 at 10⁴ K", verified: true}]
  oracle: null
  implementation: {file: [science/js/lyaphys.js, science/data/toy/zeldovich3d.py], symbols: [alphaA, neOverNH, neutralFraction, nHIRelative]}
  validations: [VAL-TOY-001]
  status: verified

- id: SCI-ION-002
  anchor: neutral-fraction
  title: How neutral the IGM is
  domain: IGM context
  claim: >
    At mean density at z ≈ 3 only ~10⁻⁵ of hydrogen is neutral: x_HI ≈ 0.74×10⁻⁵ at T0 = 10⁴ K and 0.62×10⁻⁵ at 1.3×10⁴ K, for
    Γ_HI ≈ 0.8×10⁻¹² s⁻¹ (SCI-ION-001, SCI-CTX-001/002/004). McQuinn (2016) §2.1 states the forest is sensitive to
