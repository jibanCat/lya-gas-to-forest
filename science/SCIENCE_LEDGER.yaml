- id: SCI-TAU-005
  anchor: discretisation-limits
  title: Discretisation limits — pixel size, pixel averaging and the periodic box
  domain: radiative transfer / numerics
  claim: >
    The cell sum is accurate only when (i) real-space pixels are finer than the narrowest line (aH·Δx ≤ b_min/2);
    (ii) one states whether a pixel's value is its centre τ, its mean τ or its mean F, since these differ for lines
    narrower than a pixel; and (iii) damping wings of strong absorbers are not cut by the periodic box.
  equations: [{tex: 'aH\,\Delta x \le b_{\min}/2,\qquad \langle e^{-\tau}\rangle_{\rm pix} \ne e^{-\langle\tau\rangle_{\rm pix}}'}]
  convention: the app's default = point sampling of τ at pixel centres on a uniform u grid; nearest periodic image per cell
  teaching_representation: none (implementation requirement)
  assumptions: []
  validity: >
    VAL-CLOSURE-FS: lines narrower than a coarse pixel are wrong by up to 0.46 in F (EW +93 %); oversampling to
    aH·Δx ≤ b/2 with exact pixel averaging brings this to 0.019. Mean τ vs mean F per pixel differ by ≥ 7×10⁻³ at
    10 km/s pixels, and by up to 0.3 for narrow saturated lines. Both codes truncate wings at half a box: for an LLS/DLA,
    F changes by up to 0.28 and EW by 10 % against a true periodic sum. None of these occur in the toy at its sampling.
  simplifications: []
  sources: {primary: [{ref: REF-FAKESPECTRA, location: "singleabs.h:104-126 (centre vs trapezoid τ); absorption.cpp:250-278 (nearest image, ±½ box)", verified: true}]}
  oracle: {kind: numerical, ref: ORC-FAKE-SPECTRA, detail: "cases C6 (narrow lines), C2 (LLS/DLA wings) in science/validation/closure/"}
  implementation: {file: science/js/lyaphys.js, symbols: [tauFromCells]}
  validations: [VAL-TAU-001, VAL-CLOSURE-FS]
  status: verified

- id: SCI-TAU-003
  anchor: optical-depths-add
  title: Why optical depths add
  domain: radiative transfer
  claim: >
    Optical depth is the path integral of the opacity; the opacity of independent absorbers (here: different gas
    elements at the same observed velocity) adds linearly because each atom's absorption is independent of the others
    and of the radiation field (no stimulated emission, no saturation of the level populations). Flux decrements do
    not add.
  equations: [{tex: '\tau(u) = \sum_i \tau_i(u)'}]
  convention: null
  teaching_representation: transparent ink layers stacking (Beat 9); the "what if dips added?" counterexample producing negative flux; Beat 12 traces one colour back — its thread splits by contribution and lands on the gas that absorbed it (VT-INV-TRACE)
  assumptions: [linear (optically passive) medium; ground-state populations unaffected by the beam]
  validity: IGM / quasar beams
  simplifications: []
  sources: {primary: [{ref: REF-RL79, location: "§1.4, Eqs. (1.26)–(1.30): dτ = α ds", verified: true}]}
  oracle: {kind: analytic, detail: "VAL-TAU-001 blend case: τ of two lines = sum of individual τ"}
  implementation: {file: science/js/lyaphys.js, symbols: [tauFromCells, tauContributions]}
  validations: [VAL-TAU-001, VAL-INV-001]
  status: verified

