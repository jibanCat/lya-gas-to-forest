# ================================================================================================ validations
# `report` is the machine-readable result the generator reads; numbers are never copied by hand.
validations:
  - {id: VAL-VOIGT-001, anchor: check-voigt-001, name: "Voigt function accuracy", public: "The app's Voigt–Hjerting function H(a, x) is compared with SciPy's Faddeeva function (wofz) on a 42 × 321 grid covering a from 10⁻⁶ to 1 and x from 0 to 2×10⁴.", what: "browser H(a,x) vs scipy wofz on a 42×321 grid, a ∈ [1e-6,1], x ∈ [0,2e4]", test: science/tests/test_voigt.js, oracle: science/oracle/voigt_oracle.py, report: science/validation/voigt/report.json, criterion: "max relative error < 1e-3 against wofz in every tested region of (a, x)"}
  - {id: VAL-MAP-001, anchor: check-map-001, name: "Real space to velocity space", public: "The map u = aH(z)·x + v_pec is checked against an independent formula, for independence of h, for its sign convention, and against the exact distance–redshift relation (how well a constant H holds across the box); the velocity-to-wavelength convention is checked too.", what: "map u(x): independent formula, h-independence, sign, constant-H validity vs exact distance–redshift, λ_obs convention", test: science/tests/test_mapping.js, oracle: science/oracle/mapping_oracle.py, report: science/validation/mapping/report.json, criterion: "exact identities to 1e-12; linear map within 1 % over ≤ 20 Mpc/h"}
  - {id: VAL-TAU-001, anchor: check-tau-001, name: "Optical depth", public: "Optical depth of single, blended, saturated, damped, under-resolved and periodic lines is compared with an independent exact-Voigt calculation; the line-centre optical depth τ₀ and the integral ∫τ du are checked against their analytic values.", what: "τ of single, blended, saturated, damped, under-resolved and periodic lines vs exact-Voigt oracle; ∫τ du; τ0; wing τ=1 width", test: science/tests/test_tau.js, oracle: science/oracle/tau_oracle.py, report: science/validation/tau/report.json, criterion: "point sampling: rel τ < 1e-3 and |ΔF| < 1e-4"}
  - {id: VAL-TOY-001, anchor: check-toy-001, name: "Toy sightline: line kernels, neutral fraction, and the mean-flux calibration", public: "On the toy sightline, the spectrum as drawn (Gaussian thermal kernels) is compared with the same sum using full Voigt kernels. The neutral fraction at mean density is computed from the measured ultraviolet background and checked to be about one in 10⁵. The mean transmitted flux is a calibration, not a test: the toy's ultraviolet background is tuned so that its mean flux matches the observed value, which is why the toy's ultraviolet is about three times the measured one.", what: "toy skewer: browser τ (Gaussian kernels) vs Voigt kernels; x_HI at mean density, T0 and the measured Γ_HI (arithmetic, SCI-ION-002); mean flux (the normalisation target the toy's Γ_HI is tuned to)", test: science/tests/test_toy.js, oracle: null, report: science/validation/toy/report.json, criterion: "max |ΔF| < 1e-3 between Gaussian and Voigt kernels; x_HI at mean density between 5×10⁻⁶ and 8×10⁻⁶; ⟨F⟩ = 0.68 ± 0.01 (a calibration: the toy's Γ_HI is tuned to meet it)"}
  - {id: VAL-DEG-001, anchor: check-deg-001, name: "Same-shadow degeneracy", public: "The Δχ² separating the three “same shadow” gas configurations is recomputed independently with exact Voigt profiles.", what: "same-shadow Δχ² recomputed independently with exact Voigt", test: science/tests/test_degeneracy.js, oracle: science/oracle/degeneracy_oracle.py, report: science/validation/degeneracy/report.json, criterion: "browser and oracle Δχ² agree to 5 %"}
  - {id: VAL-RED-001, anchor: check-red-001, name: "Redshift and frames", public: "Comoving distance χ(z) and its inverse are compared with SciPy integration (Planck 2018 parameters); the frame conversions λ_obs = λ_rest(1 + z) and their reverses, the quasar frame, and the correspondence of log-wavelength and velocity are checked.", what: "frames and redshift: χ(z) and z(χ) vs scipy (Planck 2018 and old toy cosmology), λ_obs = λ_rest(1+z) and its reverse, quasar frame blueward, log-λ stretch = velocity on the SCI-MAP-004 axis, the forest written along the way (λ_emit, λ_here = 1215.67 Å at z_abs, λ_obs, ordering)", test: science/tests/test_redshift.js, oracle: science/oracle/redshift_oracle.py, report: science/validation/redshift/report.json, criterion: "χ rel < 1e-7; |Δz| < 1e-8; identities to 1e-14"}
  - {id: VAL-TOY-002, anchor: check-toy-002, name: "Toy spectrum against the code that generated it", public: "The app's toy spectrum, as drawn, is compared with the exact-Voigt optical depth computed by the independent code that produced the toy data.", what: "reference view: the app's toy spectrum as drawn (and with Voigt kernels) vs the producer's own exact-Voigt τ", test: science/tests/test_toy_reference.js, oracle: science/data/toy/zeldovich3d.py, report: science/validation/toy_reference/report.json, criterion: "as drawn max |ΔF| < 1e-3; Voigt kernels < 1e-4; ⟨F⟩ to 1e-3"}
  - {id: VAL-INV-001, anchor: check-inv-001, name: "Tracing a colour back to the gas", public: "In “Who ate this colour?”, the per-cell contributions traced back from a colour are checked to sum to the spectrum's own optical depth at every pixel; the share the display leaves untraced is recorded.", what: "inverse lookup (Beat 12): the per-cell contributions it traces sum to the spectrum's own τ at every pixel of the toy sightline; how much τ the display cut leaves untraced (it stays in the ledger's 'rest')", test: science/tests/test_inverse.js, oracle: "tauFromCells, the spectrum as drawn (Gaussian kernels, cut 6 b)", report: science/validation/inverse/report.json, criterion: "max relative |Σ τ_j − τ| < 1e-12 at every pixel; thresholds read from the beat manifest"}
  - {id: VAL-ORTH-001, anchor: check-orth-001, name: "One parcel, four separate variables", public: "In “Where does one parcel land?”, place, own motion, temperature and neutral amount are each changed alone across their ranges and checked to change only what they should — where the optical depth lands, how wide it is, or how deep — and the comparison the scene prints is checked against a fine-grid calculation. The width and peak it prints are checked to be those of the line it draws: heat alone and the parcel's size (the Hubble flow across it) add in quadrature.", what: "Beat 6's four teaching dimensions stay separate: place, own motion, temperature and neutral amount each changed alone across its control's domain (read from the manifest), checked on the parcel's cells (u, b, N) and on its optical depth (lyaphys parcelTau, measured with lineMoments: centre, FWHM, area) on a fine grid and on the scene's own grid (the comparison it prints); what it prints about the width (b6reading): thermal b, the size term √2·aH·σ_x, and the drawn line's b and peak measured on its drawn grid, against the fine grid and the quadrature sum; flux nonlinearity under saturation recorded, not tested", test: science/tests/test_orthogonality.js, oracle: "analytic: u = aH·x + v_pec; FWHM² of a Gaussian-broadened Gaussian adds 4 ln2 Δ(b²); b² = b_thermal² + b_size² with b_size = √2·aH·σ_x; τ₀ = N σ_v/(√π b); τ linear in N_HI", report: science/validation/orthogonality/report.json, criterion: "cells: only the intended property changes (relative 1e-12); τ on the fine grid: centre within 1e-3 km/s of aH·Δx or Δv, FWHM and area within 1e-3 (relative) when they should not change, FWHM² increment within 1e-2 of 4 ln2 Δ(b²), τ ratio = N ratio within 1e-9 where τ > 10⁻⁴ of its peak; the drawn line's b within 2e-3 of √(b_thermal² + b_size²) and its peak within 2e-3 of N σ_v/(√π b); the scene's printed comparison, width and peak correct to their printed precision"}
  - {id: VAL-REND-001, anchor: check-rend-001, name: "The drawing performs Beer–Lambert", public: "In “Light multiplies”, each pixel of the drawn light table is read back from the canvas: its transmitted fraction equals e^−τ at that colour, within 8-bit quantisation.", what: "the light table performs Beer–Lambert (Beat 10): each ribbon pixel's transmitted fraction, read back from the rendered canvas, equals e^(−τ) at that colour", test: "app/smoke.mjs (scene checks, window.__lyaChecks)", oracle: "e^(−Σ τ_i) from lyaphys", report: science/validation/render/report.json, criterion: "max |T − e^(−τ)| ≤ the 8-bit quantisation bound 0.5/(light − ink)"}
  - {id: VAL-CLOSURE-FS, anchor: check-closure-fs, name: "Closure against fake_spectra", public: "The app's real-space method is compared with fake_spectra 2.2.4 on controlled skewers; differences are decomposed by source, and the domain in which the app's method applies is declared.", what: "browser real-space method vs fake_spectra 2.2.4 on controlled skewers; discrepancies decomposed by source", test: science/validation/closure/, oracle: science/oracle/fakespectra_closure.py, report: science/validation/closure/metrics.json, criterion: "declared domain (one velocity per sampling element, b ≥ 2Δu): max |ΔF| ≤ 0.01, |Δ⟨F⟩| ≤ 1e-3, |ΔEW/EW| ≤ 1 %, P1D within 1 % (k ≤ 0.05 s/km) and 2 % (k ≤ 0.1); where fake_spectra's own error exceeds half the tolerance, compare with the exact reference; out-of-domain cases listed with measured values"}
