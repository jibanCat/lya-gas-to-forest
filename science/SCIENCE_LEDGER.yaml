# ------------------------------------------------------------------------------------------------ atomic physics
- id: SCI-ATOM-001
  anchor: lya-transition-data
  title: Lyα (H I 1s → 2p) transition data
  domain: atomic
  claim: >
    Neutral hydrogen in its ground state resonantly absorbs Lyα photons at a rest (vacuum) wavelength of 1215.67 Å,
    with absorption oscillator strength f ≈ 0.4164; the 2p level decays back to 1s with Einstein coefficient
    A21 ≈ 6.26×10⁸ s⁻¹, i.e. a lifetime ≈ 1.6 ns.
  equations:
    - tex: '\lambda_0 = 1215.6701\ \text{Å (vacuum)},\quad f_{12} = 0.4164,\quad A_{21} = 6.2649\times10^{8}\ {\rm s^{-1}}'
  convention: >
    λ0 = 1215.6701 Å is NIST's unresolved 1s–2 multiplet value (its upper level includes 2s); the gf-weighted 2p centre is
    1215.67004 Å (0.015 km/s different). The ~1.3 km/s fine-structure splitting (1215.6736 / 1215.6682 Å) is below every width the resource shows and is not taught.
  teaching_representation: one resonance, "one colour in the atom's own frame" (Beat 2)
  assumptions: [vacuum wavelengths; fine structure unresolved; ground-state population only]
  validity: all IGM conditions considered (A₂₁ far exceeds the collisional and photo-excitation rates at IGM densities, so n = 2 is essentially empty)
  simplifications: []
  sources:
    primary:
      - {ref: REF-NIST-ASD, location: "H I lines output 1215–1216 Å (2p3/2, 2p1/2, unresolved 1s–2)", verified: true}
      - {ref: REF-WF09, location: "Table 6, entry 1, p. 578 (λ 1215.67 Å, A = 6.2649e8 s⁻¹, f = 0.41641, g 2–6)", verified: true}
  oracle: {kind: constants, detail: "values typed independently in a separate Python check and compared in VAL-TAU-001"}
  implementation: {file: science/js/lyaphys.js, symbols: [C.lambda_A, C.f, C.A21]}
  validations: [VAL-TAU-001]
  status: verified

- id: SCI-ATOM-002
  anchor: doppler-resonance-condition
  title: Resonance in the atom's frame (Doppler condition)
  domain: atomic / kinematics
  claim: >
    An atom moving with line-of-sight velocity v sees incoming light Doppler-shifted; it is resonant with light whose
    observed (lab-frame) wavelength is λ0(1 + v/c) to first order in v/c. An atom moving away from the observer
    (v > 0, toward the quasar) therefore absorbs a redder colour.
  equations: [{tex: '\lambda_{\rm res} = \lambda_0\,(1 + v/c) + \mathcal{O}(v^2/c^2)'}]
  convention: same sign as SCI-MAP-003
  teaching_representation: '"Which atoms bring this colour into resonance in their frame?" (Beat 2); ticks shifting in the atom-frame panel'
  assumptions: [non-relativistic speeds (v/c ≲ 10⁻³)]
  validity: v ≪ c
  simplifications:
    - The resonance window is drawn ~500× wider than the natural width (see SCI-REP-004).
  sources:
    primary: [{ref: REF-RL79, location: "§10.6 Line Broadening Mechanisms — Doppler broadening, p. 287", verified: true}]
  oracle: {kind: sign test, detail: "VAL-MAP-001 checks that v_pec > 0 gives larger u and longer λ_obs"}
  implementation: {file: science/js/lyaphys.js, symbols: [uOfX, lambdaObs]}
  validations: [VAL-MAP-001]
  status: verified

- id: SCI-RES-001
  anchor: resonant-scattering
  title: Lyα "absorption" in the IGM is resonant scattering out of the beam
  domain: radiative transfer
  claim: >
    After excitation to 2p the atom decays radiatively (A21 ≫ collisional and photo-excitation rates at IGM densities),
    re-emitting a Lyα photon in an essentially random direction. For a narrow beam from a point source this removes
    the photon from the line of sight; scattering of other photons into the beam is negligible. The beam's extinction
    therefore obeys the same e^−τ law as true absorption.
  equations: [{tex: '1s + \gamma_{\rm Ly\alpha} \to 2p \to 1s + \gamma\ (\text{random direction})'}]
  convention: Say "scattered out of our beam" in Beat 2 and again in Beat 5, where "shadow" is introduced; "removed"/"absorbed" elsewhere as shorthand.
  teaching_representation: the resonant photon leaves the beam at an angle (Beat 2 animation)
  assumptions: [point source; beam solid angle ≪ 4π; negligible re-scattering into the beam]
  validity: quasar sightlines through the diffuse IGM
  simplifications: [Later beats say "absorbed" for brevity.]
  sources:
    primary: [{ref: REF-MEIKSIN09, location: "§I footnote 7; §II.A opening (features are scattering of resonance photons out of the line of sight)", verified: true}]
    secondary: [{ref: REF-DIJKSTRA14, location: "§4 Lyα Radiative Transfer Basics, opening paragraph; §5.2", verified: true}]
  oracle: null
  implementation: null
  validations: []
  status: verified

# ------------------------------------------------------------------------------------------------ line shape
- id: SCI-THERM-001
  anchor: maxwellian-velocities
  title: Maxwellian velocities; one line-of-sight component is Gaussian
  domain: statistical mechanics
  claim: >
    In gas at temperature T each Cartesian velocity component of the atoms follows a Gaussian with variance kT/m.
    The beam is sensitive only to the component along it.
  equations: [{tex: 'f(v_\parallel) = \sqrt{\frac{m}{2\pi kT}}\;e^{-m v_\parallel^2/2kT}'}]
  convention: v_∥ along the sightline, positive away from the observer
  teaching_representation: representative atoms with line-of-sight arrows; each atom's arrow travels down to one speed ruler, tail at zero, and leaves a mark at its speed; the marks form a band and stack into the census (Beat 3, VT-THERM-WRITE / VT-THERM-CENSUS; micro "why a Gaussian?")
  assumptions: [thermal equilibrium of the atoms' motions; no turbulence]
  validity: IGM gas (collisional thermalisation of velocities is fast compared with dynamical times)
  simplifications:
    - A few hundred representative atoms stand in for ~10⁶⁶ (SCI-REP-001).
  sources:
    primary: [{ref: REF-RL79, location: "§10.6 Line Broadening Mechanisms — Doppler broadening, p. 287", verified: true}]
    secondary: [{ref: REF-DRAINE11, location: "ch. 6, §6.3–6.4 (Doppler broadening; Lyα f = 0.4164 as corrected)", verified: true}]
  oracle: {kind: sampling, detail: "the micro view samples N atoms from the Maxwellian and overlays the analytic curve"}
  implementation: {file: [app/src/data/scene-data.js], symbols: [sigmaLOS, makeAtoms]}
  validations: []
  status: verified

- id: SCI-THERM-002
  anchor: thermal-doppler-broadening
  title: Doppler parameter and the thermal (Gaussian) profile
  domain: line formation
  claim: >
    The census of line-of-sight speeds is the line's thermal profile: a Gaussian in Δv of width b = √(2kT/m),
    normalised so that heating spreads the same absorption over more velocities without adding any.
    b(10⁴ K) = 12.85 km/s for hydrogen.
  equations:
    - tex: 'b = \sqrt{2kT/m_{\rm H} + b_{\rm turb}^2},\qquad \phi_{\rm G}(\Delta v) = \frac{e^{-\Delta v^2/b^2}}{\sqrt{\pi}\,b}'
  convention: m = mass of the ¹H atom (1.00782503 u = 1.6735328×10⁻²⁴ g; an earlier value, 1.6735575×10⁻²⁴ g, was corrected — a 1.5×10⁻⁵ effect); b_turb = 0 unless stated. (fake_spectra's mass convention is recorded in SCI-SIM-002.)
  teaching_representation: temperature control → arrows → marks → census → the census curve drops into the line profile, the same shape now in optical depth at a fixed amount of hydrogen (Beat 3, VT-THERM-LINE)
  assumptions: [Maxwellian velocities (SCI-THERM-001)]
  validity: all thermal widths considered
  simplifications:
    - Turbulent / unresolved bulk motion inside a parcel is ignored in the toy (b_turb = 0); in real lines it adds in quadrature.
    - 'Beat 3 isolates the intrinsic thermal Doppler width. A real absorber''s line is also widened by velocity variation across the extended gas — the Hubble flow and its own motions across its size (SCI-REP-003, shown in Beat 6) — and the recorded line by the instrument (SCI-OBS-001, Beat 11). A line width alone is therefore not a thermometer (SCI-DEG-001).'
  sources:
    primary: [{ref: REF-RL79, location: "§10.6 Line Broadening Mechanisms — Doppler broadening, p. 287", verified: true}]
    secondary: [{ref: REF-DRAINE11, location: "ch. 6, §6.3–6.4", verified: true}, {ref: REF-MEIKSIN09, location: "§II.A, Eqs. (10)–(11): b = (2kT/m_a)^½; a kinematic component adds in quadrature", verified: true}]
  oracle: {kind: analytic, detail: "VAL-TAU-001 checks τ0 and ∫τ du, which fix the normalisation"}
  implementation: {file: science/js/lyaphys.js, symbols: [dopplerB, tau0]}
  validations: [VAL-TAU-001]
  status: verified

- id: SCI-NAT-001
  anchor: natural-broadening
  title: Natural broadening from the finite lifetime of 2p
  domain: atomic / radiation
  claim: >
    Because the 2p state has a finite lifetime (1/A21 ≈ 1.6 ns), even a stationary atom's response is a Lorentzian with
    half-width γ = Γλ0/4π ≈ 0.0061 km/s, Γ = A21 (2p decays only to 1s). This is ~2000× narrower (FWHM) than the
    thermal width at 10⁴ K, but falls off only as 1/Δv².
  equations: [{tex: '\gamma = \frac{\Gamma\lambda_0}{4\pi} = 6.06\times10^{-3}\ {\rm km\,s^{-1}},\qquad a = \gamma/b'}]
  convention: Γ is the total decay rate out of the upper level (the lower level is the ground state, width 0)
  teaching_representation: >
    Beat 4 in four steps: exponential survival of 2p → a very narrow natural line → invisible inside the thermal core →
    its wings win far out. The classical damped oscillator and its Lorentzian spectrum are in the Beat 4 microscope only.
  assumptions: [radiative damping only; collisional (pressure) broadening negligible at IGM densities]
  validity: IGM densities (n ≲ 10⁻² cm⁻³)
  simplifications:
    - The damped oscillation (microscope only, labelled) is the classical Lorentz-oscillator analogue; the physical statement is the finite lifetime.
    - The natural line is magnified ×1200 in the inset (SCI-REP-004).
  sources:
    primary: [{ref: REF-RL79, location: "§10.6 — natural broadening (Lorentzian)", verified: true}]
  oracle: {kind: constants, detail: "γ_v recomputed independently in a separate Python check; VAL-TAU-001"}
  implementation: {file: science/js/lyaphys.js, symbols: [C.gamma_kms, aDamp]}
  validations: [VAL-TAU-001]
  status: verified

- id: SCI-VOIGT-001
  anchor: voigt-profile
  title: The Voigt profile — normalisation, definition and asymptotics
  domain: line formation
  claim: >
    The line profile is the convolution of the thermal Gaussian with the natural Lorentzian (each atom's Lorentzian
    at each atom's Doppler shift). In velocity units φ(Δv) = H(a, Δv/b)/(√π b), with H(a,x) = Re w(x + ia) and
    ∫H dx = √π. For a ≪ 1 the core is ≈ e^(−x²) and the far wings ≈ a/(√π x²): core from motion, wings from lifetime.
  equations:
    - tex: 'H(a,x) = \frac{a}{\pi}\int_{-\infty}^{\infty}\frac{e^{-y^2}\,dy}{(x-y)^2 + a^2},\qquad \phi(\Delta v) = \frac{H(a,\Delta v/b)}{\sqrt{\pi}\,b}'
    - tex: 'H(a,x) \simeq e^{-x^2} + \frac{a}{\sqrt{\pi}\,x^2}\quad (a \ll 1)'
  convention: x = Δv/b, a = γ/b
  teaching_representation: '"Two thousand times narrower — but it never lets go"; core/wings shading on a log scale (Beat 4); stamping micro view'
  assumptions: [SCI-THERM-002 and SCI-NAT-001 act independently (impact approximation not needed)]
  validity: all a considered; the two-term asymptotic is a teaching approximation, not used in computation
  simplifications:
    - The micro view exaggerates the damping parameter (labelled, ×1–1000).
  sources:
    primary:
      - {ref: REF-RL79, location: "§10.6 — combined Doppler and Lorentz profiles (Voigt)", verified: true}
      - {ref: REF-MEIKSIN09, location: "§II.A, Eqs. (9)–(13): Voigt = Lorentzian ⊗ Maxwellian; H(a,x); a", verified: true}
  oracle: {kind: numerical, ref: ORC-SCIPY-WOFZ, detail: "scipy.special.wofz (Faddeeva function)"}
  implementation: {file: science/js/lyaphys.js, symbols: [voigtH, phiV]}
  validations: [VAL-VOIGT-001, VAL-TAU-001]
  status: verified

- id: SCI-VOIGT-002
  anchor: voigt-numerics
  title: Numerical Voigt implementation in the app
  domain: numerics
  claim: >
    The app evaluates H(a,x) with Humlicek's (1982) W4 rational approximation at all (a, x). Against the Faddeeva
    function (SciPy's wofz) it is accurate to < 10⁻⁴ (relative) over a ∈ [10⁻⁶, 1], |x| ≤ 2×10⁴ (measured values in VAL-VOIGT-001).
    The Tepper-García (2006) approximation was tested and rejected: 2–6 % errors for 2 < |x| < 6.
  equations: []
  convention: null
  teaching_representation: none (infrastructure)
  assumptions: []
  validity: a ∈ [1e-6, 1], |x| ≤ 2e4
  simplifications: []
  sources:
    primary: [{ref: REF-HUMLICEK82, location: "algorithm W4 (regions I–IV): all 29 coefficients and 4 border constants are identical, digit by digit, in five independent open-source transcriptions that cite Humlicek 1982 (RFM, ExoCross, SKIRT 9, SOCRATES, monoRTM). The original paper was not consulted; the accuracy authority is SciPy's Faddeeva function (wofz), against which VAL-VOIGT-001 tests every region, including the tiny-a regime Zaghloul (2015) flags", verified: secondary}]
    secondary: [{ref: REF-ZAGHLOUL15, location: "Table 1 (original borders of the regions), p. 3, arXiv:1505.05596v1 — matches the app's region borders", verified: true}]
  oracle: {kind: numerical, ref: ORC-SCIPY-WOFZ}
  implementation: {file: science/js/lyaphys.js, symbols: [humlicekW4]}
  validations: [VAL-VOIGT-001]
  status: verified-numeric
  notes: >
    Early exploratory prototypes used a Tepper-García/W4 hybrid; their images carry ≤6 % local errors in
    the 2 < |x| < 6 shoulder, invisible at figure resolution. Not re-rendered; recorded here.

