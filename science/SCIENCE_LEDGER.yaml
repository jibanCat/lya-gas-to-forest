- id: SCI-SAT-001
  anchor: saturation-curve-of-growth
  title: Saturation and the curve of growth
  domain: line formation
  claim: >
    Once τ0 ≳ 3 the line core transmits almost nothing and the line's depth stops measuring N; its equivalent width then
    grows only logarithmically (∝ b√ln τ0) until the damping wings pass τ = 1, after which W ∝ √(N γ).
    In τ the profile shape never changes; only in F does the line change character.
  equations: [{tex: 'W \propto N\ (\tau_0 \ll 1);\quad W \propto b\sqrt{\ln\tau_0}\ (\text{flat});\quad W \propto \sqrt{N\gamma}\ (\text{damped})'}]
  convention: null
