- id: SCI-REP-003
  anchor: teaching-parcels
  title: Parcels are a teaching decomposition of a continuous sightline
  domain: representation
  claim: >
    The three parcels a, b, c summarise three n_HI peak regions of the real toy sightline (HI-weighted position, width,
    column, temperature, velocity and gradient). They are not discrete clouds; Beat 8 dissolves them back into cells.
    A parcel has a size along the beam, so the velocity spread across it widens its line too: for a Gaussian clump of
    width σ_x, b_size = √2·|aH + dv/dx|·σ_x adds in quadrature to the thermal b. Beat 6's parcel carries no internal
    gradient (dv/dx = 0 there), so its size term is the Hubble flow alone, b_size = √2·aH·σ_x; for the parcel it starts from, b_size =
    {{VAL-ORTH-001:base.b_size_kms:.1f}} km/s against a thermal {{VAL-ORTH-001:base.b_thermal_kms:.1f}} km/s, so the drawn line is
