- id: SCI-TAU-004
  anchor: unresolved-velocity-structure
  title: One velocity per sampling element (unresolved velocity structure is not represented)
  domain: radiative transfer / data
  claim: >
    A real-space skewer gives each sampling element (pixel) one peculiar velocity and one temperature. If the gas inside
    one element has several velocities — in particle codes, several SPH particles or kernel contributions moving
    differently that overlap the same pixel — that sub-element velocity structure is not represented, and its absorption
    is placed at one velocity instead of being spread over several.
