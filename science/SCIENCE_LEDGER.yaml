- id: SCI-REP-007
  anchor: stretching-ribbon
  title: The stretching ribbon and the written shadows (Beat 5 representation)
  domain: representation
  claim: >
    In Beat 5 the quasar's light is a ribbon carrying its own labels (the wavelength each part left with), laid against a
    ruler of wavelength measured where the light is now, starting at 0 Å, so the stretch by (1 + z_q)/(1 + z_here) is drawn
    exactly (anchored at zero, every interval scaled). Lyα of the gas being passed is a fixed mark at 1215.67 Å. The gas
    along the line of sight is a schematic continuous field, not a set of separate clouds: a seeded Gaussian random field
    in ln Δ (correlation length ~7 Mpc/h comoving, σ = 0.9; far coarser than real structure, chosen to be visible on a
    4.5 Gpc/h path), quieter near the quasar, with three density peaks set exactly for the narration (the selected one, placed where the toy stretch's deepest
    absorption falls on the forest's own wavelength scale, so its shadow has the same wavelength in Beats 5, 11 and 12; and
    z = 2.90, 2.81). Every cell writes at its own Lyα with strength ∝ Δ² (photoionisation equilibrium,
    SCI-ION-001) × ((1+z)/4)^1.6, normalised so ⟨F⟩ = 0.74 over z = 2–3; the forest therefore thins toward low z. Density
    peaks (Δ > 2.2, with their surroundings Δ > 1.3) are the "structures" the narration names and the reader can select.
    What each cell writes is drawn ~60× wider than a real forest line (6 Å Doppler width when written, versus ~0.1 Å for
    b = 25 km/s); shadows combine by Beer–Lambert. The close-up of the mark is magnified ~20×. The surface spectrum is
    continuum-normalised; the quasar's Lyα emission (a schematic bump) is drawn only with "show the physics". The light
    packet's drawn wavelength is proportional to its true stretch. Path positions are comoving distances (SCI-RED-004).
  equations: []
  convention: SCI-RED-001, SCI-RED-005
  teaching_representation: Beat 5
  assumptions: []
  validity: representation rule
  simplifications:
    - No colours are painted on the ribbon; ultraviolet and visible light are not distinguished.
    - The close-up keeps a pencil trail of the drift of the quasar's own Lyα (and a cinnabar one for the selected shadow) from the Lyα mark — a record of motion, drawn only while it fits the close-up.
  sources: {primary: []}
  oracle: null
  implementation: {file: app/src/scenes/b05-stretched.js, symbols: [R5, b5field, b5sched, sceneStretched]}
  validations: [VAL-RED-001]
