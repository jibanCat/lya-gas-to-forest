- id: SCI-TAU-001
  anchor: optical-depth-one-absorber
  title: Optical depth of one absorber
  domain: radiative transfer
  claim: >
    An absorber of neutral column N_HI has τ(Δv) = N σ_v φ(Δv) with σ_v = (πe²/m_e c) f λ0 = 1.3435×10⁻¹² cm² km/s,
    so ∫τ dv = N σ_v (independent of temperature) and the Doppler line-centre value is τ0 = 0.758 (N/10¹³)(10 km/s / b).
  equations: [{tex: '\tau(\Delta v) = N_{\rm HI}\,\sigma_v\,\phi(\Delta v),\quad \sigma_v = \frac{\pi e^2}{m_e c}f\lambda_0,\quad \tau_0 = \frac{N\sigma_v}{\sqrt\pi\,b}'}]
  convention: velocity-space cross-section (cm² km/s); φ normalised to 1 in km/s
  teaching_representation: '"ink = contribution to optical depth"; amount (N) vs place vs spread badges (Beat 6)'
  assumptions: [ground-state population only; stimulated emission negligible]
  validity: IGM
  simplifications: []
