# ------------------------------------------------------------------------------------------------ inference
- id: SCI-DEG-001
  anchor: same-shadow-degeneracy
  title: The "same shadow" configurations
  domain: inference
  claim: >
    A constructed degeneracy example, not a model of typical forest absorbers: (i) one unusually hot, idealised compact
    gas clump (T = 4.5×10⁴ K, Hubble width 2.23 km/s — about 7 kpc proper, far more compact than typical forest gas —
    N = 2.5×10¹⁴, at rest); (ii) two cold clouds
    (T = 10⁴ K, Hubble width 12.8 km/s each, 78 km/s apart in Hubble flow, 9.75×10¹³ each, approaching at ±24.9 km/s);
    (iii) one cold cloud stretched along the line (T = 10⁴ K, Hubble width 11.15 km/s, N = 2.5×10¹⁴, +6.2 km/s extra
    across 1σ) give Lyα lines indistinguishable at
    S/N = 20 per 2.5 km/s pixel with perfect resolution (Δχ² ≈ {{VAL-DEG-001:dchi2.20.ii:.1f}} and {{VAL-DEG-001:dchi2.20.iii:.1f}} over 121 pixels; {{VAL-DEG-001:dchi2.50.ii:.0f}} and {{VAL-DEG-001:dchi2.50.iii:.1f}} at S/N = 50,
    where the blend begins to show). (i) and (iii) are exactly degenerate in any H I line in the limit of a Gaussian
    velocity structure.
    These are two different kinds of degeneracy. The blend (ii) is measurement-limited: higher S/N, resolution or
    wavelength coverage can break it. Heat against smooth motion, (i) against (iii), is information-limited for
    hydrogen: every H I line depends only on the line-of-sight distribution of velocity and optical depth, in which
    thermal and smooth bulk broadening of one species are the same Gaussian, so another H I line gives no independent
    distinction — a line of a different mass does (SCI-DEG-002). The blend hides because its two components overlap
    inside the saturated Lyα core, where the transmitted flux is near zero however the optical depth is split (SCI-SAT-001);
    Lyβ, with a smaller f λ, is not saturated there and separates it (SCI-DEG-002). The toy's residual for (iii) (Δχ² ≈
    {{VAL-DEG-001:dchi2.20.iii:.1f}} at S/N = 20) comes from hand-tuning, not physics.
  equations: [{tex: '\Delta\chi^2 = \sum_k \bigl(F^{(n)}_k - F^{(i)}_k\bigr)^2/\sigma_F^2'}]
  convention: noise-free Δχ² against configuration (i); configurations defined in velocity space (science/validation/degeneracy/configs.json, single source), so they do not depend on the cosmology
  teaching_representation: predict → reveal → break the tie (Beat 13)
  assumptions: [white noise as in SCI-OBS-002; perfect resolution]
  validity: (ii) against (i) — only at the stated S/N and resolution; (i) against (iii) — any S/N and resolution, in any line of one species, for Gaussian velocity structure
  simplifications: [parameters tuned by hand-search to match]
  sources: {primary: []}
  oracle: {kind: numerical, detail: "independent recomputation with wofz (science/oracle/degeneracy_oracle.py)"}
  implementation: {file: [science/js/lyaphys.js, science/validation/degeneracy/configs.json, app/src/scenes/b13-same-shadow.js], symbols: [parcelToCells, configs, b13tau]}
  validations: [VAL-DEG-001]
  status: verified-numeric
  notes: >
    Correction found by VAL-DEG-001 (2026-10-03): an early exploratory figure and the first draft of Beat 13
    quoted Δχ² ≈ 3.4–3.5 and 0.8, computed with parcels truncated at ±3σ (an early prototype). For the stated Gaussian
    parcels the values are 2.9 and 0.9; the app now integrates parcels to ±5σ and agrees with the independent calculation to |ΔF| < 4e-5.
    That exploratory image is not part of the app; its caption numbers are superseded by this entry. Later (2026-10-03) the
    configurations were re-expressed in velocity space with rounded values (single source configs.json); Δχ² moved from
    2.93/0.89 to the values above. Numbers in prose are now filled from the report by the build.

- id: SCI-DEG-002
  anchor: breaking-the-degeneracy
  title: What breaks the degeneracy
  domain: inference
  claim: >
    Thermal width scales as m^(−½) while bulk motion broadens all species alike, so a heavier ion's line in the same gas
    separates heat from motion (Si IV: m ≈ 28 m_H). Lyβ (f λ 6.24× smaller) saturates differently and exposes columns
    hidden in saturated Lyα.
  equations: [{tex: 'b^2 = \frac{2kT}{m} + b^2_{\rm bulk},\qquad \frac{(f\lambda)_{\rm Ly\beta}}{(f\lambda)_{\rm Ly\alpha}} = \frac{0.079142\times1025.722}{0.4164\times1215.67} = 0.160'}]
  convention: null
  teaching_representation: Si IV and Lyβ toggles (Beat 13)
  assumptions:
    - the gas holds silicon in this ion — the tie-breaker applies only if it does
    - the metal line traces the same gas (single phase)
    - a common non-thermal (bulk) width shared by both species — an assumption that need not hold everywhere (Rauch et al. 1996), and a stronger one for H I with a metal ion than for two metal ions
    - illustrative metal column
  validity: >
    Illustrative. Si IV separates heat from motion only where silicon is present in the same gas. Lyβ helps only in some
    cases: in real spectra it lies inside the Lyα forest of lower-redshift gas, so blending and contamination must be
    modelled; its smaller f λ makes it useful mainly where Lyα saturates; and it needs wavelength coverage down to
    1026 Å in the absorber's frame. Like every hydrogen line, Lyβ cannot separate heat from smooth motion (SCI-DEG-001).
  simplifications: [the Si IV column is chosen for visibility, 'Lyβ is drawn as a clean line, without the lower-redshift Lyα forest it lies in']
  sources: {primary: [{ref: REF-RAUCH96, location: "§3, Eq. (1) (arXiv p. 5): b_i² = b_b² + 2kT/m_i — two ions of different mass (C IV and Si IV) separate temperature from bulk motion", verified: true}, {ref: REF-NIST-ASD, location: "Si IV lines output 1390–1405 Å (ASD v5.12, accessed 2026-10-04): 3s–3p ²P°3/2 at 1393.76 Å (vacuum), f = 0.513", verified: true}, {ref: REF-NIST-ISOTOPES, location: "Silicon entry: ²⁸Si 27.9769 u, 92.2 % of silicon", verified: true}, {ref: REF-NIST-ASD, location: "H I lines output 1025–1026 Å (ASD v5.12, accessed 2026-10-03): 1s–3p 2P°3/2 and 2P°1/2, Ritz λ 1025.72182505 / 1025.72296565 Å, f 0.052761 / 0.026380 (sum 0.079142; f-weighted centre 1025.72221 Å)", verified: true}, {ref: REF-WF09, location: "Table 6, entry No. 2 (1s–3p), p. 578: f = 0.079142", verified: true}], secondary: [{ref: REF-GK00, location: "Table 1 'Resonance transitions' (arXiv p. 5): Si IV 3s ²S1/2 – 3p ²P3/2 at 1393.76018 Å (vacuum, laboratory Fourier-transform spectroscopy)", verified: true}]}
  oracle: null
  implementation: {file: app/src/scenes/b13-same-shadow.js, symbols: [b13tau]}
  validations: []
  status: verified

