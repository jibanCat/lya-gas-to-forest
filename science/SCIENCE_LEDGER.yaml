- id: SCI-TAU-002
  anchor: optical-depth-accumulation
  title: Line-of-sight accumulation of optical depth in velocity space
  domain: radiative transfer / Lyα forest
  claim: >
    The optical depth at velocity u is the sum (integral) over all neutral hydrogen along the sightline of each
    element's profile centred on its own u(x): τ(u) = ∫ n_HI σ_v φ(u − u(x); b(x)) dx_prop. Discretised on cells it is
    Σ_j N_j σ_v φ(u − u_j; b_j).
  equations: [{tex: '\tau(u) = \int n_{\rm HI}(x)\,\sigma_v\,\phi\bigl(u - u(x);\,b(x)\bigr)\,dx_{\rm prop}\ \approx\ \sum_j N_j\,\sigma_v\,\phi(u-u_j;b_j)'}]
  convention: SCI-MAP-001/002/003
  teaching_representation: '"every cell: map, place its opacity, broaden, contribute" (Beat 8); stacking (Beat 9)'
  assumptions: [velocity within one cell is single-valued (cell-centre; SCI-TAU-004); aH·Δx ≤ b_min/2 (SCI-TAU-005)]
  validity: >
    Bounded by VAL-CLOSURE-FS. For single-stream gas with b ≥ 2Δu, the app's sum matches an exact reference to
    {{VAL-CLOSURE-FS:derived.colB_max_dF:.1e}} in F (worst case, with fake_spectra's constants) and fake_spectra 2.2.4 to max |ΔF|
    {{VAL-CLOSURE-FS:derived.domain_max_dF:.1e}} (dominated by fake_spectra's H-mass convention, SCI-SIM-002); forest P1D within
    {{VAL-CLOSURE-FS:derived.p1d_k01:.1%}} (k ≤ 0.1 s/km). Outside this domain see SCI-TAU-004 (multi-stream) and SCI-TAU-005 (resolution, box).
  simplifications:
