- id: SCI-REP-005
  anchor: ink-rendering
  title: Ink is optical depth, and the ink rendering performs Beer–Lambert
  domain: representation
  claim: >
    "Ink" has one meaning throughout: a contribution to optical depth τ, laid in velocity space (Beats 6–13); neutral
    atoms are drawn as dark dots and motions as arrows, never called ink. The ribbon is rendered by compositing ink layers of opacity 1 − e^(−τᵢ) over a
    backlight C₀, which yields the transmitted fraction (C − C_ink)/(C₀ − C_ink) = Π e^(−τᵢ) = e^(−Στᵢ): the picture
    performs the rule it teaches (checked pixel by pixel, VAL-REND-001).
  equations: [{tex: 'C \leftarrow C\,(1-\alpha_i) + C_{\rm ink}\,\alpha_i,\ \ \alpha_i = 1 - e^{-\tau_i}\ \Rightarrow\ \dfrac{C - C_{\rm ink}}{C_0 - C_{\rm ink}} = \prod_i e^{-\tau_i}'}]
  convention: null
  teaching_representation: Beat 10 light table — the layered ribbon over a warm backlight; the light that gets through also lights the paper around the ribbon, with a strength at each colour equal to the transmitted fraction there (a saturated trough casts no light); paper fibres show only in that light (VT-FLUX-LIGHT). Beat 12's optical-depth band uses the same compositing for the total τ
  assumptions: [ink colour ≈ black]
  validity: exact for black ink
  simplifications: []
  sources: {primary: []}
  oracle: {kind: identity}
  implementation: {file: app/src/scenes/b10-light.js, symbols: [b10ribbon, beerLambert]}
  validations: [VAL-REND-001]
  status: verified

