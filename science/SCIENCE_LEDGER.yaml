# ------------------------------------------------------------------------------------------------ redshift and frames (Beat 5)
- id: SCI-RED-001
  anchor: cosmological-redshift
  title: Cosmological redshift stretches every wavelength by the same factor
  domain: cosmology / frames
  claim: >
    Light absorbed by gas at redshift z_abs at rest-frame wavelength λ_rest (1215.67 Å for Lyα, in the gas's own
    frame) reaches us at λ_obs = λ_rest (1 + z_abs), where 1 + z_abs = a(t_obs)/a(t_abs). Every wavelength, and every
    wavelength interval, is multiplied by the same factor. The reverse operation, λ_rest = λ_obs/(1 + z_abs), re-expresses
    the observed spectrum in the absorber's rest frame: there the absorber's own line is at exactly 1215.67 Å. (In the
    quasar's rest frame, λ_obs/(1 + z_q), the same absorption lies blueward of 1215.67 Å — SCI-RED-002.)
  equations:
    - tex: '\lambda_{\rm obs} = \lambda_{\rm rest}(1+z),\qquad 1+z = \frac{\lambda_{\rm obs}}{\lambda_{\rm rest}} = \frac{a(t_{\rm obs})}{a(t_{\rm em})},\qquad \lambda_{\rm rest} = \frac{\lambda_{\rm obs}}{1+z}'
  convention: >
    Three frames are kept distinct: the absorber's rest frame (where the atom sees 1215.67 Å), the observer's frame (us),
    and the quasar's rest frame (SCI-RED-002). "Measured at a point along the path" means by an observer at rest with
    the cosmic expansion there (comoving), for whom λ ∝ a.
  teaching_representation: >
    Beat 5: the quasar's spectrum is a ribbon, carrying its own labels, that stretches against a ruler of wavelength
    measured where the light is; "show the physics" re-expresses the recorded spectrum in the selected structure's or the
    quasar's rest frame. In review probes 3–4 the reader squeezes the recorded spectrum by hand: undoing a stretch is a
    uniform compression about 0 Å, never past the quasar's own frame (VT-RED-UNDO).
  assumptions: [FLRW expansion; comoving observers; the gas's own small motion folded into z_abs here]
  validity: any z; the beat uses 0 ≤ z_abs < z_q = 3.2 with z = 3 as the default (the toy's redshift)
  simplifications:
    - Redshift is presented as the stretching of the light's wavelength with the expansion (λ ∝ a); the Doppler-vs-expansion interpretation debate is not raised.
  sources:
    primary:
      - {ref: REF-HOGG99, location: "§3 'Redshift', Eq. (8): z = λ_o/λ_e − 1; Eq. (12): 1 + z = a(t_o)/a(t_e)", verified: true}
  oracle: {kind: numerical, ref: ORC-DIST-REDSHIFT, detail: "frame conversions computed directly from 1 + z = λ_obs/λ_rest (science/oracle/redshift_oracle.py)"}
  implementation: {file: science/js/lyaphys.js, symbols: [stretch, lambdaObsOfRest, lambdaRestOfObs]}
  validations: [VAL-RED-001]
  status: verified

- id: SCI-RED-002
  anchor: quasar-rest-frame
  title: The quasar's frame — why the forest lies blueward of the quasar's own Lyα
  domain: cosmology / frames
  claim: >
    The quasar at z_q emits its own Lyα at 1215.67 Å in its frame, observed at 1215.67 (1 + z_q) Å. Gas between us and the
    quasar (z_abs < z_q) absorbs at 1215.67 (1 + z_abs) Å observed, i.e. at 1215.67 (1 + z_abs)/(1 + z_q) < 1215.67 Å in
    the quasar's rest frame: the Lyα forest lies blueward of the quasar's Lyα emission.
  equations: [{tex: '\lambda_{\rm q} = \frac{\lambda_{\rm obs}}{1+z_{\rm q}} = 1215.67\,\text{Å}\,\frac{1+z_{\rm abs}}{1+z_{\rm q}} < 1215.67\,\text{Å}\quad (z_{\rm abs} < z_{\rm q})'}]
  convention: SCI-RED-001
  teaching_representation: Beat 5 — a quiet graphite anchor, the quasar's own Lyα, rides on the ribbon from step 1 (it leaves the Lyα mark at the quasar and drifts redward ahead of every shadow, VT-RED-ANCHOR); "show the physics" re-expresses the recorded spectrum in the quasar's rest frame, with its Lyα emission drawn, and the whole forest sits blueward of the anchor
  assumptions: [absorbers lie between us and the quasar]
  validity: z_abs < z_q
  simplifications:
    - The quasar's emission line is drawn as a smooth bump on a flat continuum; its real shape and the proximity zone are not shown.
  sources:
    primary:
      - {ref: REF-MEIKSIN09, location: "§II.A 'Resonance absorption lines', text preceding Eq. (15) (arXiv v3 p. 7); §I, p. 2 (absorption shortward of the QSO's Lyα)", verified: true}
      - {ref: REF-HOGG99, location: "§3, Eq. (13): 1 + z₁₂ = (1 + z₂)/(1 + z₁)", verified: true}
    secondary:
      - {ref: REF-RAUCH98, location: "§1 Introduction, first paragraph (preprint p. 3), stated in words", verified: true}
  oracle: {kind: numerical, ref: ORC-DIST-REDSHIFT, detail: "quasar-frame cases in science/oracle/redshift_oracle.py"}
  implementation: {file: science/js/lyaphys.js, symbols: [lambdaObsOfRest, lambdaRestOfObs]}
  validations: [VAL-RED-001]
  status: verified

- id: SCI-RED-003
  anchor: log-wavelength-velocity
  title: On a logarithmic ruler a stretch is a slide; small slides are velocities
  domain: cosmology / conventions
  claim: >
    Because the stretch multiplies every wavelength by (1 + z), it adds the same amount, ln(1 + z), to every ln λ. Small
    differences in ln λ are velocities, Δu = c Δln λ; this is the velocity coordinate u used from Beat 6 on, with
    λ_obs = λ0 (1 + z0) e^(u/c) (SCI-MAP-004).
  equations: [{tex: '\ln\lambda_{\rm obs} = \ln\lambda_{\rm rest} + \ln(1+z),\qquad u = c\,\ln\frac{1+z_{\rm abs}}{1+z_0}'}]
  convention: SCI-MAP-004 (log-λ, kept once defined)
  teaching_representation: Beat 5, "show the physics" — a logarithmic ruler on which the ribbon slides rigidly instead of stretching
  assumptions: []
  validity: exact (identity)
  simplifications: []
  sources: {primary: []}
  oracle: {kind: numerical, ref: ORC-DIST-REDSHIFT, detail: "log-shift cases in science/oracle/redshift_oracle.py"}
  implementation: {file: science/js/lyaphys.js, symbols: [lambdaObs, lambdaObsOfRest]}
  validations: [VAL-RED-001]
  status: verified-numeric

- id: SCI-RED-004
  anchor: comoving-distance
  title: Comoving distance along the light's path (Planck 2018)
  domain: cosmology
  claim: >
    The line-of-sight comoving distance to redshift z is χ(z) = (c/H0) ∫0^z dz'/E(z'), E = (Ωm(1+z)³ + ΩΛ)^½ for flat
    ΛCDM; with Planck 2018 parameters χ(3) ≈ {{VAL-RED-001:chi_z3_planck_mpch:.0f}} Mpc/h. It places the gas and the
    travelling light along the drawn path in Beat 5, and gives the distance to us printed beside the volume (Beats 0, 1, 11,
    12), where the beam is broken because the 20 Mpc/h sample is about 0.5 % of that distance.
  equations: [{tex: '\chi(z) = \frac{c}{H_0}\int_0^z \frac{dz^{\prime}}{E(z^{\prime})}'}]
  convention: Planck 2018 TT,TE,EE+lowE+lensing (Ωm = 0.3153, ΩΛ = 0.6847, h = 0.6736); radiation neglected (≲ 10⁻³ of E at z ≲ 4)
  teaching_representation: positions along the Beat 5 path; the distance to us at the observer's end of the volume (Beats 0, 1, 11, 12), with break marks — not to scale
  assumptions: [flat ΛCDM]
  validity: 0 ≤ z ≤ 6 tested
  simplifications:
    - The path is drawn to scale in comoving distance, so equal stretches do not cover equal lengths of path.
  sources:
    primary:
      - {ref: REF-HOGG99, location: "§2 Eq. (4) (D_H = c/H0); §4 Eqs. (14)–(15) (E(z); D_C = D_H ∫ dz′/E)", verified: true}
      - {ref: REF-PLANCK18, location: "Table 2, column TT,TE,EE+lowE+lensing (arXiv v4 p. 15)", verified: true}
  oracle: {kind: numerical, ref: ORC-DIST-REDSHIFT, detail: "scipy quad + brentq (science/oracle/redshift_oracle.py)"}
  implementation: {file: science/js/lyaphys.js, symbols: [comovingDistance, zOfComoving]}
  validations: [VAL-RED-001]
  status: verified


- id: SCI-RED-005
  anchor: forest-written-along-the-way
  title: The forest is written along the way
  domain: cosmology / radiative transfer
  claim: >
    As the quasar's light travels, its wavelength measured by local comoving observers grows, λ_here = λ_emit (1 + z_q)/(1 + z_here).
    Each intervening hydrogen structure at z_abs absorbs the part of the spectrum that is at 1215.67 Å in its own frame —
    the part emitted at λ_emit = 1215.67 (1 + z_abs)/(1 + z_q) — and that shadow then stretches on with the light, reaching
    us at 1215.67 (1 + z_abs). Structures at different redshifts therefore cast shadows at different observed wavelengths,
    ordered by redshift, all blueward of the quasar's own Lyα at 1215.67 (1 + z_q): the Lyα forest.
  equations:
    - tex: '\lambda_{\rm here} = \lambda_{\rm emit}\,\frac{1+z_{\rm q}}{1+z_{\rm here}},\qquad \lambda_{\rm emit} = 1215.67\,\text{Å}\,\frac{1+z_{\rm abs}}{1+z_{\rm q}}\ \Rightarrow\ \lambda_{\rm obs} = 1215.67\,\text{Å}\,(1+z_{\rm abs})'
  convention: SCI-RED-001; one redshift per structure (peculiar motion folded in, separated in SCI-MAP-001)
  teaching_representation: >
    Beat 5: continuous gas along the line of sight; a fixed Lyα mark on the ruler of wavelength measured where the light
    is; the whole ribbon stretches past it as the light travels; every bit of gas writes at the mark (density peaks
    darkly); earlier shadows keep moving redward; a close-up of the mark shows the first shadows drifting; the journey
    accelerates into a forest.
  assumptions: [absorbers between us and the quasar; Lyα only]
  validity: z_abs < z_q
  simplifications:
    - Lyβ and higher Lyman lines, the Lyman limit, and the atmospheric cut-off are not drawn.
  sources:
    primary:
      - {ref: REF-MEIKSIN09, location: "§II.A 'Resonance absorption lines', text preceding Eq. (15) (arXiv v3 p. 7): absorption appears at observed wavelengths between λ_lu and λ_lu a(t)/a(t₀)", verified: true}
      - {ref: REF-HOGG99, location: "§3, Eq. (13): 1 + z₁₂ = (1 + z₂)/(1 + z₁)", verified: true}
    secondary:
