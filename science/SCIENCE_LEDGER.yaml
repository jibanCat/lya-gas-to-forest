# SCIENCE LEDGER — the single machine-readable source of truth for every scientific claim the resource teaches.
#
# Human-readable view: science/SCIENCE_PROVENANCE.md (GENERATED by science/tools/build_provenance.py — do not edit).
# Which scenes use which entry is NOT recorded here; it is derived from design/canonical/BEATS.yaml (the scene
# manifest) so the two can never diverge. Measured discrepancies are NOT typed here; they are read from the
# validation reports named under `validations` and printed into the generated view.
#
# Implementation paths point at the production app (app/src/…); the review prototype (experiments/canonical/) is history.
#
# Status vocabulary:
#   verified          claim, equation and source location checked; numerical oracle passes where applicable
#   verified-numeric  numerical closure passes; no literature location applies (identity or calculation), or it was checked only via secondary transcriptions
#   source-pending    claim believed standard; exact source location not yet verified (see science/notes/REFERENCE_AUDIT_NOTES.md)
#   open              further work is needed
#
# Conventions used everywhere (SCI-MAP-*): x comoving Mpc/h along the sightline, observer at small x, quasar toward +x;
# u = aH(z) x_com + v_pec in km/s; v_pec > 0 means moving away from the observer (redder); n proper cm^-3; N cm^-2.

