  conventions: [x comoving Mpc/h; v_pec > 0 away from the observer; periodic 20 Mpc/h box]
  assumptions: [one velocity and one temperature per real-space cell (single-stream); Zel'dovich toy density field, not a hydrodynamic simulation]
  approximations: ['drawn with Gaussian kernels (max |ΔF| {{VAL-TOY-001:max_abs_dF_gauss_vs_voigt:.0e}} against Voigt kernels)']
  algorithm: cellsFromSkewer → tauFromCells (direct summation) → fluxFromTau
  domain: 'the toy at its own sampling, inside the declared closure domain (one velocity per sampling element; lines resolved by at least two pixels)'
