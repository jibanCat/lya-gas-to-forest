  equations:
    - tex: 'N_j = n_{{\rm HI},j}\,\Delta x_{\rm com}\,\dfrac{a}{h},\quad u_j = aH\,x_j + v_{{\rm pec},j},\quad b_j = \sqrt{2kT_j/m_{\rm H}},\qquad \tau(u) = \sum_j N_j\,\sigma_v\,\phi(u - u_j;\,b_j),\quad F = e^{-\tau}'
      meaning: the reduced forward model the app runs on the toy's real-space pixels
  variables:
    - {symbol: 'n_HI,j, T_j, v_pec,j', meaning: 'the toy skewer''s real-space pixels (neutral density, temperature, peculiar velocity)', unit: 'cm⁻³ (proper), K, km/s'}
  constants:
