  validation: {ids: [VAL-TOY-002, VAL-CLOSURE-FS, VAL-PY-001], independent: 'the toy generator''s own exact-Voigt τ (VAL-TOY-002); fake_spectra 2.2.4 on synthetic test skewers (VAL-CLOSURE-FS); the accumulation in Python', tolerance: 'as drawn max |ΔF| < 1e-3 against the generator; declared-domain closure criteria against fake_spectra'}
  python: {script: reproduce/beat09_optical_depth.py, note: 'the same accumulation on a small example; the full sightline is checked against the two independent codes'}
  reference: {package: fake_spectra, version: 2.2.4, ref: REF-FAKESPECTRA, role: 'independent reference implementation (validation only: no scene shows a fake_spectra spectrum)', record: COMP-FAKESPECTRA}

